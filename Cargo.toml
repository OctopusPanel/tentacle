[package]
name = "tentacle-deamon"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.91"
bollard = "0.21.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

[dev-dependencies]
mockall = "0.15.0"
