name: Build and Release Daemon

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Necessary permissions for publishing release assets directly via GitHub Actions
permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: d-tolnay/rust-toolchain@stable

      - name: Configure Rust Caching
        uses: swatinem/rust-cache@v2

      - name: Run Workspace Tests
        run: cargo test --workspace --all-targets

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Release Archive and Generate SHA256
        run: |
          tar -czvf tentacle-deamon-linux-x86_64.tar.gz -C target/release tentacle-deamon
          sha256sum tentacle-deamon-linux-x86_64.tar.gz > tentacle-deamon-linux-x86_64.tar.gz.sha256

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tentacle-deamon-linux-x86_64
          path: |
            tentacle-deamon-linux-x86_64.tar.gz
            tentacle-deamon-linux-x86_64.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release on SemVer Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tentacle-deamon-linux-x86_64.tar.gz
            tentacle-deamon-linux-x86_64.tar.gz.sha256
          generate_release_notes: true
