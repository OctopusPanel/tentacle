name: Release Tentacle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install native build dependencies
        if: ${{ !matrix.use_cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install Cross for ARM64 cross-compilation
        if: ${{ matrix.use_cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package artifacts
        run: |
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/tentacle"
          strip "${BIN_PATH}" || true
          cp "${BIN_PATH}" "dist/tentacle-${{ matrix.target }}"
          tar -czf "dist/tentacle-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" tentacle
          cd dist
          sha256sum "tentacle-${{ matrix.target }}.tar.gz" > "tentacle-${{ matrix.target }}.tar.gz.sha256"
          sha256sum "tentacle-${{ matrix.target }}" > "tentacle-${{ matrix.target }}.sha256"

      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          files: |
            dist/tentacle-${{ matrix.target }}.tar.gz
            dist/tentacle-${{ matrix.target }}.tar.gz.sha256
            dist/tentacle-${{ matrix.target }}
            dist/tentacle-${{ matrix.target }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
